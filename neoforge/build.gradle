plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    runs {
        configureEach {
            // Lets `/test runall` and the GameTest server run this mod's GameTests.
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
            gameDirectory = this.mkdir(this.file('runs/client'))
        }
        server {
            server()
            gameDirectory = this.mkdir(this.file('runs/server'))
        }
        data {
            clientData()
            gameDirectory = this.mkdir(this.file('runs/data'))
            // Datagen writes into common, so both loaders ship the same generated resources.
            // (rootProject.project: inside a run block, project() makes a dependency, not a Project.)
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', rootProject.project(':common').file('src/generated/resources/').getAbsolutePath(),
                    '--existing', rootProject.project(':common').file('src/main/resources/').getAbsolutePath()
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = this.mkdir(this.file('runs/gameTestServer'))
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    compileOnly 'org.jetbrains:annotations:24.1.0'
    implementation "com.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    implementation "net.tslat:smartbrainlib-neoforge-${minecraft_version}:${sbl_version}"
    implementation "net.blay09.mods:balm-neoforge:${balm_version}"
    implementation "dev.architectury:architectury-neoforge:${architectury_api_version}"
}

// Implement mcgradleconventions loader attribute (MultiLoader Template)
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}
