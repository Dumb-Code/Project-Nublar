<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dinosaur hitbox layouts</title>
<style>
:root{--bg:#faf9f5;--text:#1f1e1d;--muted:#5f5e5a;--border:rgba(0,0,0,.12);--chip:#f0eee6}
@media (prefers-color-scheme:dark){:root{--bg:#1f1e1d;--text:#ecebe6;--muted:#b4b2a9;--border:rgba(255,255,255,.14);--chip:#2c2c2a}}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;margin:0;padding:16px}
main{max-width:720px;margin:0 auto}
h1{font-size:20px;font-weight:500;margin:0 0 4px}
p{color:var(--muted);font-size:14px;margin:0 0 12px}
.row{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin:0 0 10px}
.sp{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.sp button{font:inherit;font-size:13px;padding:6px 12px;border-radius:8px;border:.5px solid var(--border);background:transparent;color:var(--text);cursor:pointer}
.sp button.on{background:var(--chip);border-color:var(--muted)}
.grid{display:grid;grid-template-columns:auto minmax(0,1fr) 52px;gap:6px 12px;align-items:center;font-size:13px;color:var(--muted);margin:0 0 8px}
.v{color:var(--text);font-weight:500}
svg{display:block;width:100%;height:auto}
.ts{font-size:12px;fill:var(--muted)}
#info{font-size:13px;color:var(--muted);margin:6px 0 0;line-height:1.7}
</style></head><body><main>
<h1>Dinosaur hitbox layouts</h1>
<p>Adult size at gene 0 and render scale, rest pose from each geo file with bone rotations applied. Every part has a square footprint.</p>
<div class="sp" id="sp"></div>
<div class="row">
<label><input type="checkbox" id="cM" checked> Model cubes</label>
<label><input type="checkbox" id="cP" checked> Hit parts</label>
<label><input type="checkbox" id="cB" checked> Movement box</label>
<label><input type="checkbox" id="cO"> Today's box</label>
<label><input type="checkbox" id="cC"> Spacing capsule</label>
</div>
<div class="grid">
<span>Growth</span><input type="range" id="sG" min="0.25" max="1" step="0.05" value="1"><span id="oG" class="v">100%</span>
<span>Yaw (top view)</span><input type="range" id="sY" min="0" max="180" step="5" value="0"><span id="oY" class="v">0°</span>
</div>
<svg id="side" viewBox="0 0 680 380" role="img" aria-label="Side view"></svg>
<svg id="top" viewBox="0 0 680 400" role="img" aria-label="Top view"></svg>
<div id="info"></div>
