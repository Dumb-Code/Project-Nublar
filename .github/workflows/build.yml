name: Build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          # The default branch is not the integration branch, so name the branch that saves the cache.
          cache-read-only: ${{ github.ref != 'refs/heads/integration/1.20.1' }}
      - run: chmod +x gradlew && ./gradlew build :common:test --no-daemon --console=plain
      - uses: actions/upload-artifact@v6
        with:
          name: projectnublar-forge
          path: |
            forge/build/libs/*.jar
            !forge/build/libs/*-sources.jar
            !forge/build/libs/*-javadoc.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: projectnublar-fabric
          path: |
            fabric/build/libs/*.jar
            !fabric/build/libs/*-sources.jar
            !fabric/build/libs/*-javadoc.jar
          if-no-files-found: error
