name: Build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - run: chmod +x gradlew && ./gradlew build :common:test --no-daemon --console=plain
      - uses: actions/upload-artifact@v6
        with:
          name: projectnublar-forge
          path: |
            forge/build/libs/*.jar
            !forge/build/libs/*-sources.jar
            !forge/build/libs/*-javadoc.jar
      - uses: actions/upload-artifact@v6
        with:
          name: projectnublar-fabric
          path: |
            fabric/build/libs/*.jar
            !fabric/build/libs/*-sources.jar
            !fabric/build/libs/*-javadoc.jar
