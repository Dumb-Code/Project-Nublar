plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev.legacyforge'
}

legacyForge {
    mcpVersion = minecraft_version
    if (file("src/main/resources/META-INF/accesstransformer.cfg").exists()) {
        accessTransformers = ["src/main/resources/META-INF/accesstransformer.cfg"]
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

dependencies {
    api project(":nublar-gui")

    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    compileOnly group: 'org.jetbrains',name:'annotations',version: '24.1.0'

    implementation "fuzs.forgeconfigapiport:forgeconfigapiport-common:${project.forge_config_api_port_version}"
    implementation "net.tslat.smartbrainlib:SmartBrainLib-common-${project.minecraft_version}:${project.sbl_version}"
    compileOnly "software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}"
  //  implementation ("com.nyfaria.nyfsguilib:nyfsguilib-common-${minecraft_version}:${ngl_version}") {transitive = false}
    implementation 'mysticdrew:common-networking-common:1.0.3-1.20.1'
    implementation "earth.terrarium.botarium:botarium-forge-1.20.1:2.3.4"
   // modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"
    compileOnly "dev.architectury:architectury-forge:$rootProject.architectury_api_version"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

// Unit tests may use Minecraft value classes (for example Vec3); the main compile classpath holds Minecraft.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
// The tests load Minecraft value classes and the mod libraries at run time too.
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath

test {
    useJUnitPlatform()
    testLogging { events "failed"; exceptionFormat = "full" }
    // Minecraft's log4j2.xml writes logs/ relative to the working directory, so run the tests in build output.
    workingDir = layout.buildDirectory.dir("test-run")
    doFirst { workingDir.mkdirs() }
    // CI evidence: print one count line per run, and fail when the run finds no test.
    afterSuite { desc, result ->
        if (!desc.parent) {
            println "Unit tests: ${result.testCount} run, ${result.successfulTestCount} passed, ${result.failedTestCount} failed, ${result.skippedTestCount} skipped"
            if (result.testCount == 0) throw new GradleException("No unit test found in ${project.path}:test")
        }
    }
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'
artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    sourceSets.main.resources.sourceDirectories.forEach {
        commonResources it
    }
}
