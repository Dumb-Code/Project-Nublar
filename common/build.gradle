plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    // common compiles against vanilla only (NeoForm), not against a loader.
    neoFormVersion = neo_form_version
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
}

dependencies {
    api project(':nublar-gui')

    compileOnly 'org.jetbrains:annotations:24.1.0'

    // GeckoLib has no common artifact; compile against the NeoForge jar and use only its loader-neutral classes.
    compileOnly "com.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    // GeckoLib makes vanilla render states implement GeoRenderState by interface injection; apply it to common's vanilla jar.
    interfaceInjectionData "com.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    implementation "net.tslat:smartbrainlib-common-${minecraft_version}:${sbl_version}"
    implementation "net.blay09.mods:balm-common:${balm_version}"
    // Holds net.neoforged.neoforge.common.ModConfigSpec for common code.
    implementation "fuzs.forgeconfigapiport:forgeconfigapiport-common-neoforgeapi:${forge_config_api_port_version}"
    // The common Architectury artifact ships only a -dev.jar, so common compiles against the NeoForge jar.
    compileOnly "dev.architectury:architectury-neoforge:${architectury_api_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

tasks.named('compileJava') {
    options.compilerArgs += ['-Xmaxerrs', '10000'] // compile window, removed in Task 11
}

// Unit tests may use Minecraft value classes (for example Vec3); the main compile classpath holds Minecraft.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
// The tests load Minecraft value classes and the mod libraries at run time too.
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath

test {
    useJUnitPlatform()
    testLogging { events "failed"; exceptionFormat = "full" }
    // Minecraft's log4j2.xml writes logs/ relative to the working directory, so run the tests in build output.
    workingDir = layout.buildDirectory.dir("test-run")
    doFirst { workingDir.mkdirs() }
    // CI evidence: print one count line per run, and fail when the run finds no test.
    afterSuite { desc, result ->
        if (!desc.parent) {
            println "Unit tests: ${result.testCount} run, ${result.successfulTestCount} passed, ${result.failedTestCount} failed, ${result.skippedTestCount} skipped"
            if (result.testCount == 0) throw new GradleException("No unit test found in ${project.path}:test")
        }
    }
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'
artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    sourceSets.main.resources.sourceDirectories.forEach {
        commonResources it
    }
}

// Implement mcgradleconventions loader attribute (MultiLoader Template): the loaders ask for the 'common' variant.
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'common')
            }
        }
    }
}
