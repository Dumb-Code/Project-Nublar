# Important Notes:
# fabric.mod.json's modid field cannot be expanded, you must change it manually.
# Every field you add must be added to build-logic/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=0.0.24
group=net.dumbcode.projectnublar
java_version=25

# Common
minecraft_version=26.2
license=CC0-1.0
credits=Nyfaria, ShadowTek, Tfarcenim, Adversing, HerrChaos and the Dumb-Code team
mod_name=Project Nublar
mod_author=Dumb-Code
mod_id=projectnublar
description=Clone dinosaurs from fossils and amber, raise them in powered enclosures.
minecraft_version_range=[26.2, 26.3)
# The Minecraft version that common compiles against, see https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.2-1

# Fabric
fabric_version=0.161.0+26.2
fabric_loader_version=0.20.1

# NeoForge
neoforge_version=26.2.0.93
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Publishing
curseforge_publishing_enabled=false
curseforge_project_id=0
modrinth_publishing_enabled=false
modrinth_project_id=0
publishFabric=true
publishForge=true
dry_run=false

# Dependencies
forge_config_api_port_version=26.2.1
# GeckoLib 5.5.6 was not published for Fabric, so Fabric uses 5.5.5.
geckolib_version=5.5.6
geckolib_fabric_version=5.5.5
sbl_version=2.0.3
# Architectury is used for registration only.
architectury_api_version=21.1.12
balm_version=26.2.0.9
# Nested in the Fabric jar; Balm uses it for energy when it is present.
team_reborn_energy_version=5.0.0
