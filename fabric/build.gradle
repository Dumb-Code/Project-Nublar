plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

// Minecraft 26.x is unobfuscated: no mappings line, and plain implementation in place of modImplementation.
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    implementation "com.geckolib:geckolib-fabric-${minecraft_version}:${geckolib_fabric_version}"
    implementation "net.tslat:smartbrainlib-fabric-${minecraft_version}:${sbl_version}"
    implementation "net.blay09.mods:balm-fabric:${balm_version}"
    implementation "dev.architectury:architectury-fabric:${architectury_api_version}"
    include(implementation("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forge_config_api_port_version}"))
    // Nested so Balm can expose energy to cable mods. Fabric Loader keeps the newest nested copy,
    // so a newer Team Reborn Energy from another mod wins over this one.
    include(implementation("teamreborn:energy:${team_reborn_energy_version}"))
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// Server GameTests from the main source set (the test instances are in common's generated data).
// Loom adds the run `runGameTest` (in build/run/gameTest) and makes `check` depend on it,
// so `build` runs it.
// The mod has no client GameTests. With them off, Loom makes no client test run and no EULA file.
fabricApi {
    configureTests {
        createSourceSet = false
        modId = mod_id
        enableGameTests = true
        enableClientGameTests = false
    }
}

// Implement mcgradleconventions loader attribute (MultiLoader Template)
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
